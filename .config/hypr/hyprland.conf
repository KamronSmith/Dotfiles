exec-once = dbus-update-activation-environment --systemd --all
exec-once = hyprctl dispatch workspace name:1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = firefox &
# exec-once = emacsclient -c -a ""
exec-once = hyprpaper &
exec-once = udiskie &
# exec-once = /home/kam/.local/bin/mouseless --no-compositing &

# env = QT_QPA_PLATFORM,wayland
# env = QT_QPA_PLATFORMTHEME,qt6ct
# # env = QT_STYLE_OVERRIDE,qt6ct
# env = QT_WAYLAND_DISABLE_WINDOW_DECORATION,0
# env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GNUPGHOME, ~/.gnupg

monitor= DP-5, 2560x1440@144, 0x0, 1
$terminal = kitty
$fileManager = emacsclient -c -a
$menu = rofi -show drun
$editor = emacsclient -c -a ""
$browser = firefox

general {
        gaps_in = 8
        gaps_out = 20
        border_size = 2
        col.active_border = rgba(ffffffff)
        col.inactive_border = rgba(00000000)
        # no_border_on_floating = false
        resize_on_border = true
        resize_corner = 4
        allow_tearing = false
        layout = master
}

debug {
      disable_logs = true
}

decoration {
           rounding = 0
           active_opacity = 1.0
           inactive_opacity = 1.0
           shadow {
                  enabled = false
                  range = 4
                  render_power = 3
                  color = rgba(1a1a1aee)
                  color_inactive = rgba(00000000)
           }

           blur {
                enabled = true
                size = 6
                passes = 3
                new_optimizations = on
                vibrancy = 0.1696
                xray = true
          }
}

animations {
           enabled = false
           bezier = easeOutQuint,0.23,1,0.32,1
           bezier = easeInOutCubic,0.65,0.05,0.36,1
           bezier = linear,0,0,1,1
           bezier = almostLinear,0.5,0.5,0.75,1.0
           bezier = quick,0.15,0,0.1,1
           animation = global, 1, 10, default
           animation = border, 1, 5.39, easeOutQuint
           animation = windows, 1, 4.79, easeOutQuint
           animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
           animation = windowsOut, 1, 1.49, linear, popin 87%
           animation = fadeIn, 1, 1.73, almostLinear
           animation = fadeOut, 1, 1.46, almostLinear
           animation = fade, 1, 3.03, quick
           animation = layers, 1, 3.81, easeOutQuint
           animation = layersIn, 1, 4, easeOutQuint, fade
           animation = layersOut, 1, 1.5, linear, fade
           animation = fadeLayersIn, 1, 1.79, almostLinear
           animation = fadeLayersOut, 1, 1.39, almostLinear
           animation = workspaces, 1, 1.94, almostLinear, fade
           animation = workspacesIn, 1, 1.21, almostLinear, fade
           animation = workspacesOut, 1, 1.94, almostLinear, fade
}

master {
       new_status = master
       mfact = 0.50
       orientation = center
}

misc {
     force_default_wallpaper = 0
     vrr = on
     disable_hyprland_logo = true
     disable_splash_rendering = true
     focus_on_activate = true
}

input {
      kb_layout = us
      kb_variant =
      kb_model =
      kb_options =
      kb_rules =
      follow_mouse = 1
      sensitivity = 0
      touchpad {
            natural_scroll = false
      }
}

$mainMod = Control_L&Super_L&Shift_L&Alt_L

bind = $mainMod, G, fullscreen, 0
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
# bind = $mainMod, F, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, X, exec, $menu
# bind = ALT_L&SHIFT_L, X, exec, /home/kam/.dotfiles/bin/rofi-power-menu.sh
bind = $mainMod, Tab, exec, rofi -show window
bind = $mainMod, z, exec, kitty

bind = $mainMod, b, movefocus, l
bind = $mainMod, f, movefocus, r
bind = $mainMod, i, layoutmsg, swapwithmaster
bind = $mainMod, o, focuscurrentorlast

bind = $mainMod, r, exec, /home/kam/.local/bin/emacs-program-launcher.sh
bind = $mainMod, d, exec, /home/kam/.local/bin/firefox-program-launcher.sh
bind = $mainMod, t, workspace, 3
bind = $mainMod, s, workspace, 4
bind = $mainMod, c, movetoworkspacesilent, 1
bind = $mainMod, l, movetoworkspacesilent, 2
bind = $mainMod, m, movetoworkspacesilent, 3

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# windowrule = suppressevent maximize, class:.*
# windowrule = no_initial_focus on,match:class ^$, match:title ^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = match:class ^(firefox)$, workspace 1

windowrule = match:class ^(Emacs)$, workspace 2
# windowrule = match:class ^(Emacs)$, fullscreen on
# windowrule = match:class ^(Emacs)$, opacity 0.9 0.9 0.9
windowrule = match:class ^(Emacs)$, opacity 1.0 1.0 1.0

windowrule = opacity 0.80 0.80, match:class ^(Kitty)$
windowrule = match:workspace Side, match:class ^(kitty)$, match:title ^(kitty)$

windowrule = opacity 0.80 0.80, match:class ^(com.mitchellh.ghostty)$

workspace = 1,default:true,monitor:DP-2
workspace = 2,monitor:DP-2
workspace = 3,monitor:DP-2
workspace = special:kitty

# layerrule = blur, waybar
# layerrule = blur, wofi
layerrule = order 1, match:class waybar

# gaming
#### windowrule = float,class:^(steam)$
windowrule = match:workspace 3,match:class ^(steam)$,match:title ^(Steam)$
windowrule = fullscreen on, match:class ^steam_app_\d+$
windowrule = workspace 3, match:class ^steam_app_\d+$
windowrule = workspace 3, match:class ^Minecraft\*
# workspace = Gaming, border:false, rounding:false
# windowrule = idleinhibit fullscreen


# smart gaps
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0

# windowrule = bordersize:0, floating:0, match:workspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]


# dialogs
windowrule = center on, match:title ^(Open File)(.*)$
windowrule = center on, match:title ^(Select a File)(.*)$
windowrule = center on, match:title ^(Choose wallpaper)(.*)$
windowrule = center on, match:title ^(Open Folder)(.*)$
windowrule = center on, match:title ^(Save As)(.*)$
windowrule = center on, match:title ^(Library)(.*)$
windowrule = center on, match:title ^(File Upload)(.*)$

windowrule = float on, match:title ^(Open File)(.*)$
windowrule = float on, match:title ^(Select a File)(.*)$
windowrule = float on, match:title ^(Choose wallpaper)(.*)$
windowrule = float on, match:title ^(Open Folder)(.*)$
windowrule = float on, match:title ^(Save As)(.*)$
windowrule = float on, match:title ^(Library)(.*)$
windowrule = float on, match:title ^(File Upload)(.*)$

# Picture-in-Picture
windowrule = keep_aspect_ratio on, match:title ^(Picture(-| )in(-| )[Pp]icture)$
windowrule = move 73% 72%, match:title ^(Picture(-| )in(-| )[Pp]icture)$
windowrule = size 25%, match:title ^(Picture(-| )in(-| )[Pp]icture)$
windowrule = float on, match:title ^(Picture(-| )in(-| )[Pp]icture)$
windowrule = pin on, match:title ^(Picture(-| )in(-| )[Pp]icture)$

# floats
windowrule = float on, match:title ^(Volume Control)$
windowrule = float on, match:title ^(Bluetooth Devices)$
windowrule = float on, match:class ^(anki)$
windowrule = float on, match:class ^(anki)$, match:title ^(Browse)